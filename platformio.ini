; PlatformIO project — Uno R4 Minima + AA-30.ZERO SWR Meter
;
; Board:   Arduino Uno R4 Minima (Renesas RA4M1)
; Framework: Arduino (official Arduino core via PlatformIO)
;
; The sketch lives in src/AA30_Bridge.ino. Build/upload:
;   pio run                     (compile)
;   pio run -t upload           (flash via DFU/USB)
;   pio run -t monitor          (serial monitor, 115200)

[platformio]
src_dir = src
; Extra library search paths (optional third-party libs)

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200

; Adafruit display stack for the Waveshare 2.4" ILI9341 (SPI)
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341

; Optional: raise warnings to catch portability issues.
build_flags =
    -Wall
