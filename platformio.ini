; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    arduino-libraries/SD@^1.2.4
build_flags =
    -Wall
    ; ---- TFT_eSPI configuration (bypass User_Setup.h) ----
    ; MSP4021 4.0" 480x320 ST7796S + XPT2046 touch, Uno R4 SPI pins.
    ; A4/A5 are the I2C bus (battery gauge) -> display/touch moved off them.
    -DUSER_SETUP_LOADED
    -DST7796_DRIVER              ; 320x480 ST7796S panel
    -DTFT_WIDTH=320              ; native width (portrait)
    -DTFT_HEIGHT=480             ; native height (portrait)
    -DTFT_MISO=12                ; SPI MISO (shared)  -> MSP4021 SDO(MISO)
    -DTFT_MOSI=11                ; SPI COPI             -> MSP4021 SDI(MOSI)
    -DTFT_SCLK=13                ; SPI SCK              -> MSP4021 SCK
    -DTFT_CS=10                  ; LCD chip select      -> MSP4021 CS
    -DTFT_DC=9                   ; data/command         -> MSP4021 DC/RS
    -DTFT_RST=8                  ; reset                -> MSP4021 RESET
    -DTFT_BL=7                   ; backlight            -> MSP4021 LED
    -DTOUCH_CS=6                 ; XPT2046 touch CS     -> MSP4021 T_CS
    -DSPI_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD
